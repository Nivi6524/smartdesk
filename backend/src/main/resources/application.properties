# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdesk
spring.datasource.username=smartdesk_user
spring.datasource.password=smartdesk_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring AI — Ollama (free local LLM)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.embedding.model=nomic-embed-text

# JWT
app.jwt.secret=smartdesk-super-secret-key-minimum-32-chars-long
app.jwt.expiration=86400000

# Server
server.port=8080
