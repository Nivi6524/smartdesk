server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/smartdesk
    username: smartdesk_user
    password: smartdesk_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: smartdesk-super-secret-key-must-be-32-chars-minimum
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info